name: Package skill release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run deterministic smoke tests
        run: node .github/scripts/run_smoke_tests.mjs

      - name: Verify packaged version matches the release tag
        run: node scripts/sync_skill_release.mjs --assert-tag "${GITHUB_REF_NAME}" --json

      - name: Package the runtime skill
        shell: bash
        run: |
          set -euo pipefail

          skill_name="build-boutique-store-plan"
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          archive="${skill_name}-${GITHUB_REF_NAME}.zip"
          staging_dir="$(mktemp -d)"
          trap 'rm -rf "${staging_dir}"' EXIT

          test -f README.md
          test -f SKILL.md
          test -f VERSION
          for runtime_dir in agents scripts references assets dependencies; do
            test -d "${runtime_dir}"
          done

          mkdir -p "${staging_dir}/${skill_name}"
          cp README.md SKILL.md VERSION "${staging_dir}/${skill_name}/"
          cp -R agents scripts references assets dependencies "${staging_dir}/${skill_name}/"

          node .github/scripts/validate_public_package.mjs "${staging_dir}/${skill_name}"

          (
            cd "${staging_dir}"
            zip -qr "${GITHUB_WORKSPACE}/${archive}" "${skill_name}"
          )

          archive_sha256="$(sha256sum "${archive}" | cut -d ' ' -f1)"
          unzip -l "${archive}"
          echo "RELEASE_ARCHIVE=${archive}" >> "${GITHUB_ENV}"
          echo "RELEASE_SHA256=${archive_sha256}" >> "${GITHUB_ENV}"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file="${RUNNER_TEMP}/release-notes-${GITHUB_REF_NAME}.md"
          printf '%s\n\n`build-boutique-store-plan-sha256: %s`\n' \
            "下载并解压完整 Skill 工具包，打开 README.md 可复制通用 AI 安装提示词和第一次使用提示词。本版统一客户货盘与营销参谋报告周期，把现有好品和营销参谋补品绑定到各自方案，并增加客单价、广告消耗、TR（估）及二级类目自动筛选合同。v1.3.0 起每个新任务会先检查官方稳定 Release，有新版才下载并整体更新；旧版用户需手动覆盖安装一次自更新引导版。公开代码不代表获得内部 BI/GCRM 权限；附件不含客户数据、Cookie 或 Token。Release 附件的 download_count 用于统计累计 ZIP 下载次数；GitHub 自动生成的 Source code 压缩包不计入该口径。" \
            "${RELEASE_SHA256}" > "${notes_file}"
          gh release create "${GITHUB_REF_NAME}" \
            "${RELEASE_ARCHIVE}" \
            --title "精品大店规划 Skill ${GITHUB_REF_NAME}" \
            --notes-file "${notes_file}"
